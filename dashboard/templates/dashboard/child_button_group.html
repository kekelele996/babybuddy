{% load i18n %}
<div class="child-actions btn-group btn-group-lg border rounded border-light bg center-block"
     role="group"
     aria-label="{% trans "Child actions" %}">
    {% if perms.core.view_child %}
        <a href="{% url 'dashboard:dashboard-child' object.slug %}"
           class="btn"
           title="{% trans "Dashboard" %}">
            <i class="icon-dashboard" aria-hidden="true"></i>
        </a>
        <a href="{% url 'core:child' object.slug %}"
           class="btn"
           title="{% trans "Timeline" %}">
            <i class="icon-timeline" aria-hidden="true"></i>
        </a>
        <a href="{% url 'reports:report-list' object.slug %}"
           class="btn"
           title="{% trans "Reports" %}">
            <i class="icon-graph" aria-hidden="true"></i>
        </a>
    {% endif %}
    {% if perms.core.change_child %}
        <a class="btn d-none d-md-inline-block"
           href="{% url 'core:child-update' object.slug %}"
           title="{% trans "Edit" %}"
           role="button"><i class="icon-update" aria-hidden="true"></i></a>
        {% if object.archived %}
            <form method="post"
                  action="{% url 'core:child-restore' object.slug %}"
                  class="d-inline">
                {% csrf_token %}
                <button type="submit"
                        class="btn d-none d-md-inline-block"
                        title="{% trans "Restore" %}">
                    <i class="icon-refresh" aria-hidden="true"></i>
                </button>
            </form>
        {% else %}
            <a class="btn d-none d-md-inline-block"
               href="{% url 'core:child-archive' object.slug %}"
               title="{% trans "Archive" %}"
               role="button"><i class="icon-lock" aria-hidden="true"></i></a>
        {% endif %}
    {% endif %}
    {% if perms.core.delete_child %}
        <a class="btn d-none d-md-inline-block"
           href="{% url 'core:child-delete' object.slug %}"
           title="{% trans "Delete" %}"
           role="button"><i class="icon-delete" aria-hidden="true"></i></a>
    {% endif %}
</div>
